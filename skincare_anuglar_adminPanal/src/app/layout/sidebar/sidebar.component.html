<div class="h-full flex flex-col justify-between py-6 px-4">
  <div>
    <!-- Logo -->
    <div class="flex items-center gap-3 px-2 mb-8">
      <div class="w-8 h-8 bg-[#004B8F] text-white rounded flex items-center justify-center shadow-md">
        <ng-icon name="heroBeaker" class="text-xl"></ng-icon>
      </div>
      <div>
        <h1 class="text-lg font-bold text-gray-900 leading-tight">SkinAI Advisor</h1>
        <p class="text-[10px] text-gray-500 uppercase tracking-widest font-semibold mt-0.5">Clinical Dashboard</p>
      </div>
    </div>

    <!-- Main Navigation -->
    <nav class="flex flex-col gap-1">
      @for (item of navItems; track item.label) {
        <a [routerLink]="item.route" routerLinkActive="bg-[#E6F0FD] text-[#004B8F] font-semibold"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 transition-colors">
          <ng-icon [name]="item.icon" class="text-xl"></ng-icon>
          <span class="text-sm">{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>

  <div>
    <!-- Bottom Navigation -->
    <nav class="flex flex-col gap-1 mb-6">
      @for (item of bottomItems; track item.label) {
        <a [routerLink]="item.route" routerLinkActive="bg-[#E6F0FD] text-[#004B8F] font-semibold"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 transition-colors">
          <ng-icon [name]="item.icon" class="text-xl"></ng-icon>
          <span class="text-sm">{{ item.label }}</span>
        </a>
      }
    </nav>

    <!-- Export Button -->
    <button class="w-full flex items-center justify-center gap-2 py-2.5 px-4 bg-white text-[#004B8F] border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors shadow-sm font-semibold text-sm">
      <ng-icon name="heroArrowDownTray" class="text-lg"></ng-icon>
      EXPORT REPORT
    </button>
  </div>
</div>
