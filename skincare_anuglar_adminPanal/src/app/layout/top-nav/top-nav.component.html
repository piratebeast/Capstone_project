<div class="h-full px-6 flex items-center justify-between">
  <!-- Left Side: Title or Admin Logo -->
  <div class="flex items-center gap-2">
    <div class="text-[#004B8F] font-semibold text-lg flex items-center gap-2">
      <ng-icon name="heroBeaker" class="text-xl"></ng-icon>
      SkinAI Admin
    </div>
  </div>

  <!-- Right side actions -->
  <div class="flex items-center gap-5">
    <!-- Profile & Logout -->
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full overflow-hidden border border-gray-200 shadow-xs">
        <img src="https://ui-avatars.com/api/?name=Clinical+Admin&background=004B8F&color=fff" alt="User Profile" class="w-full h-full object-cover">
      </div>
      <div class="hidden md:flex flex-col text-left">
        <span class="text-xs font-bold text-gray-800 leading-tight">Admin User</span>
        <span class="text-[10px] text-gray-400 font-medium">admin&#64;skinai.local</span>
      </div>
      <button 
        (click)="logout()" 
        title="Sign Out Admin" 
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-gray-500 hover:text-red-600 hover:bg-red-50 text-xs font-bold transition-colors border border-transparent hover:border-red-100 ml-1"
      >
        <ng-icon name="heroArrowRightOnRectangle" class="text-base"></ng-icon>
        <span class="hidden sm:inline">Logout</span>
      </button>
    </div>
  </div>
</div>
